http {
    upstream api_backend { server api.internal:9000; }
    server {
        listen 8080;
        server_name example.com;
        root /srv/app/public;
        location / {
            try_files $uri $uri/ @app;
        }
        location @app {
            proxy_pass http://127.0.0.1:3000;
        }
        location /blog/ {
            rewrite ^/blog/(?<slug>[a-z0-9-]+)/?$ /v1/posts/$slug break;
            proxy_pass http://api_backend;
        }
    }
    server {
        listen 8080;
        server_name api.internal;
        location /v1/ {
            proxy_pass http://api_backend;
        }
        location / { return 404 "unknown api route"; }
    }
}
