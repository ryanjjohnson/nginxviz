name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: '17 6 * * 1' # Mondays, so newly published advisories get noticed
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    name: Known vulnerabilities (govulncheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...

  hostile-input:
    name: Hostile-input tests and fuzzing
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - name: Attack regression tests
        run: go test -race ./...
      - name: Same tests on a 32-bit build
        run: GOARCH=386 go test ./...
      - name: Verify against a real nginx
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq nginx > /dev/null
          sudo systemctl stop nginx || true
          go build -o nginxviz .
          ./nginxviz -verify examples/urls.txt -nginx /usr/sbin/nginx -o verify-out \
            -addr app=10.0.0.5:8080 -addr app=10.0.0.6:8080 -addr api=api.internal:9000 \
            edge=examples/edge/nginx.conf app=examples/app/nginx.conf api=examples/api/nginx.conf
      # 30 seconds a target on every push; 5 minutes a target on the weekly run
      - name: Fuzz every input route (configs and includes, URL file) and every output
        env:
          FUZZTIME: ${{ github.event_name == 'schedule' && '5m' || '30s' }}
        run: |
          for target in FuzzParse FuzzMermaid FuzzHTML FuzzScratchConf FuzzCases FuzzClean; do
            echo "::group::$target ($FUZZTIME)"
            go test -run '^$' -fuzz "^$target\$" -fuzztime "$FUZZTIME" .
            echo "::endgroup::"
          done
      - name: Keep any failing input
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-failures
          path: testdata/fuzz/

  codeql:
    name: Static analysis (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: stable
      - uses: github/codeql-action/init@v4
        with:
          languages: go, javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/analyze@v4
